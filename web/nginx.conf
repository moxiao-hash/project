map $http_x_request_id $request_correlation_id {
    ~^[A-Za-z0-9._-]{1,64}$ $http_x_request_id;
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"studypilot-web"}';
    }

    # 浏览器没有任何通往 Python 内部接口的代理路径。
    location /internal {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_correlation_id;
        add_header X-Request-ID $request_correlation_id always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
