map $http_x_request_id $request_correlation_id {
    ~^[A-Za-z0-9._-]{1,64}$ $http_x_request_id;
    default $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # 允许 20 MB 文件再加 multipart 边界和表单字段开销。
    client_max_body_size 25m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://player.bilibili.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"studypilot-web"}';
    }

    # 浏览器没有任何通往 Python 内部接口的代理路径。
    location /internal {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_correlation_id;
        # Java Agent 的契约超时是 120 秒，代理层保留 10 秒传输余量。
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
