services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studypilot
      MYSQL_USER: studypilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in infra/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in infra/.env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - studypilot-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/studypilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: studypilot
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in infra/.env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in infra/.env}
      AI_CREDENTIAL_MASTER_KEY: ${AI_CREDENTIAL_MASTER_KEY:?set AI_CREDENTIAL_MASTER_KEY in infra/.env}
      STUDYPILOT_AI_SERVICE_BASE_URL: http://ai-service:8000
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 25MB
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - studypilot-backend-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ai-service:
    build:
      context: ../ai-service
    environment:
      JAVA_BACKEND_BASE_URL: http://backend:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in infra/.env}
      LANGGRAPH_AES_KEY: ${LANGGRAPH_AES_KEY:?set LANGGRAPH_AES_KEY in infra/.env}
      AGENT_STATE_DB_PATH: /data/agent-state.sqlite3
      QDRANT_PATH: /data/qdrant
      FASTEMBED_CACHE_PATH: /cache/fastembed
      AGENT_WORKER_COUNT: "1"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-deepseek-v4-pro}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
    volumes:
      - studypilot-agent-data:/data
      - studypilot-hf-cache:/home/studypilot/.cache/huggingface
      - studypilot-fastembed-cache:/cache/fastembed
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: ""
        VITE_AGENT_GATEWAY: http
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - studypilot-prometheus-data:/prometheus
    depends_on:
      ai-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

volumes:
  studypilot-mysql-data:
  studypilot-backend-data:
  studypilot-agent-data:
  studypilot-hf-cache:
  studypilot-fastembed-cache:
  studypilot-prometheus-data:
