[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot-ai-service"
version = "0.1.0"
description = "StudyPilot FastAPI agent orchestration service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "filelock>=3.20,<4",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-openai>=1,<2",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "pydantic-settings>=2.7,<3",
    "prometheus-client>=0.21,<1",
    "pycryptodome>=3.23,<4",
    "qdrant-client[fastembed]>=1.14,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
