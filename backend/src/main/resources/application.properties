spring.application.name=studypilot-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studypilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

studypilot.auth.session-duration-days=${SESSION_DURATION_DAYS:7}
studypilot.internal-service-token=${INTERNAL_SERVICE_TOKEN:}
studypilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Task 31：预算切日使用的显式时区，禁止用 ZoneId.systemDefault 推断。
studypilot.assistant.budget.timezone=${ASSISTANT_BUDGET_TIMEZONE:Asia/Shanghai}
# 预占许可有效期（秒）；进程崩溃后未终结的预占在此时间后自动失效。
studypilot.assistant.budget.reservation-ttl-seconds=${ASSISTANT_BUDGET_RESERVATION_TTL_SECONDS:900}

# Task 33：受控本地界面适配器。只允许 Unix Domain Socket，绝不开放 TCP/HTTP。
# 签名密钥独立于 Runner，只从本机环境注入，不写日志、不进入模型、不提交仓库；
# 默认空值会在调用时失败关闭，不会退化为任何通用电脑控制能力。
studypilot.local-automation.socket-path=${LOCAL_AUTOMATION_SOCKET_PATH:/tmp/studypilot-local-automation/local-automation.sock}
studypilot.local-automation.signing-secret=${LOCAL_AUTOMATION_SIGNING_SECRET:}
studypilot.local-automation.connect-timeout-millis=${LOCAL_AUTOMATION_CONNECT_TIMEOUT_MILLIS:2000}
studypilot.local-automation.read-timeout-millis=${LOCAL_AUTOMATION_READ_TIMEOUT_MILLIS:5000}
# IDE 通道符号目标登记，格式 ACTION:SYMBOLIC_KEY[,ACTION:SYMBOLIC_KEY]；默认空表示失败关闭。
studypilot.local-automation.ide-targets=${LOCAL_AUTOMATION_IDE_TARGETS:}
